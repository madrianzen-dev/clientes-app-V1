<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de clientes</title>
    <style>
        :root { --azul:#1f4e8c; --gris:#f3f5f8; --borde:#d5dbe3; --rojo:#b3261e; }
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: var(--gris); margin: 0; color: #222; }
        header { background: var(--azul); color: #fff; padding: 16px 24px; }
        header h1 { margin: 0; font-size: 1.3rem; }
        main { max-width: 960px; margin: 24px auto; padding: 0 16px; display: grid; gap: 24px; }
        section { background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 20px; }
        h2 { margin-top: 0; font-size: 1.1rem; }
        form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
        label { display: grid; gap: 4px; font-size: .85rem; font-weight: 600; }
        input { padding: 8px; border: 1px solid var(--borde); border-radius: 6px; font-size: 1rem; }
        .error { color: var(--rojo); font-size: .8rem; font-weight: 400; }
        button { background: var(--azul); color: #fff; border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; font-size: 1rem; align-self: end; }
        button.peligro { background: var(--rojo); padding: 6px 10px; font-size: .85rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--borde); }
        .ok { background: #e6f4ea; border: 1px solid #b7dfc2; padding: 10px 14px; border-radius: 6px; }
        .vacio { color: #666; }
    </style>
</head>
<body>
<header><h1>Registro de clientes</h1></header>
<main>
    <div class="ok" th:if="${mensaje}" th:text="${mensaje}"></div>

    <section>
        <h2>Nuevo cliente</h2>
        <form th:action="@{/clientes}" th:object="${cliente}" method="post">
            <label>Nombre
                <input type="text" th:field="*{nombre}">
                <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
            </label>
            <label>Apellido
                <input type="text" th:field="*{apellido}">
                <span class="error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></span>
            </label>
            <label>Fecha de nacimiento
                <input type="date" th:field="*{fechaNacimiento}">
                <span class="error" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></span>
            </label>
            <label>Nacionalidad
                <input type="text" th:field="*{nacionalidad}">
                <span class="error" th:if="${#fields.hasErrors('nacionalidad')}" th:errors="*{nacionalidad}"></span>
            </label>
            <button type="submit">Registrar</button>
        </form>
    </section>

    <section>
        <h2>Clientes registrados (<span th:text="${#lists.size(clientes)}">0</span>)</h2>
        <p class="vacio" th:if="${#lists.isEmpty(clientes)}">Aún no hay clientes.</p>
        <table th:unless="${#lists.isEmpty(clientes)}">
            <thead>
            <tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Nacimiento</th><th>Nacionalidad</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.apellido}"></td>
                <td th:text="${#temporals.format(c.fechaNacimiento, 'dd/MM/yyyy')}"></td>
                <td th:text="${c.nacionalidad}"></td>
                <td>
                    <form th:action="@{/clientes/{id}/eliminar(id=${c.id})}" method="post">
                        <button class="peligro" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>

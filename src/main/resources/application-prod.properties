# Produccion: PostgreSQL en Neon. Las credenciales NUNCA van en el codigo.
# Variables de entorno requeridas (en Render: Environment):
#   DATABASE_URL = jdbc:postgresql://<host>/<base>?sslmode=require
#   DB_USER      = usuario de Neon
#   DB_PASSWORD  = contrasena de Neon
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Neon apaga el computo tras ~5 min sin uso y corta las conexiones inactivas.
# Pool chico, conexiones que se reciclan antes del corte y tiempo de espera
# suficiente para que la base despierte en la primera consulta.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000

# El health check de Render no debe consultar la base: si lo hiciera, mantendria
# Neon despierto todo el dia y gastaria las horas de computo gratuitas.
management.health.db.enabled=false

# Render Blueprint: web service con Docker. La base de datos es PostgreSQL en Neon
# (externa a Render); sus datos de conexion se cargan como variables de entorno
# en el panel de Render (sync: false = no se guardan en este archivo).
services:
  - type: web
    name: clientes-app
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
